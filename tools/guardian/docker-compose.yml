# QA Guardian — Feishu callback service (Dokploy compose)
#
# Deploy this on your Dokploy cloud server. Add a Domain in Dokploy pointing to this service on
# container port 8787; Dokploy's reverse proxy assigns a public HTTPS domain and routes to it.
# Then set the Feishu event callback URL to https://<domain>/feishu/callback.
#
# Do NOT hard-bind a host port here (e.g. `ports: 8787:8787`) — on a shared Dokploy host that
# collides ("port is already allocated"). We only `expose` the container port; Dokploy's proxy
# reaches it over the internal network via the Domain you configure.
#
# Secrets are provided via Dokploy environment variables (NOT committed):
#   FEISHU_VERIFICATION_TOKEN, FEISHU_ENCRYPT_KEY, GITHUB_TOKEN, GITHUB_REPO
# GITHUB_TOKEN must be a fine-grained PAT scoped to GITHUB_REPO with issues: read+write only.

services:
  qa-guardian-callback:
    build:
      # Build context is the repo root so the image can COPY tools/guardian/.
      context: ../..
      dockerfile: tools/guardian/Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      PORT: "8787"
      CALLBACK_PATH: "/feishu/callback"
      FEISHU_VERIFICATION_TOKEN: "${FEISHU_VERIFICATION_TOKEN}"
      FEISHU_ENCRYPT_KEY: "${FEISHU_ENCRYPT_KEY}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_REPO: "${GITHUB_REPO}"
